name: CI - Authentication WebApp (Build, Test, and Lint)

# Concurrency: Cancel in-progress runs when a new one starts (saves Actions minutes)
concurrency:
  group: ci-auth-webapp-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches:
      # Release and Stage branches: Always run CI on any push (no paths filter)
      # This ensures CI runs when PRs are merged, even if paths filter might miss merge commits
      - release
      - Release
      - stage
      - Stage
      - staging
      - Staging
      # Other branches: Run CI only when relevant files change (paths filter to save Actions minutes)
      - main
      - master
      - develop
    paths:
      # Only trigger CI when files in Authentication WebApp change
      # Note: Path filter applies to all branches, but release/stage branches will still trigger
      # due to job-level conditions that check branch name
      - 'SDMSApps/SDMS.AuthenticationWebApp/**'
      - '.github/workflows/ci-authentication-webapp.yml'
  pull_request:
    branches:
      - '**'  # Run on PRs targeting any branch
    paths:
      # Only trigger CI when files in Authentication WebApp change
      - 'SDMSApps/SDMS.AuthenticationWebApp/**'
      - '.github/workflows/ci-authentication-webapp.yml'
      # Explicitly exclude other apps to prevent false triggers
      - '!SDMSApps/SDMS.B2CWebApp/**'
      - '!SDMSApps/SDMS.B2BWebApp/**'
      - '!SDMSApps/SDMS.BackOfficeWebApp/**'
      - '!SDMSApps/SDMS.VendorWebApp/**'
      - '!SDMSApps/SDMS.DeliveryPartnerWebApp/**'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

jobs:
  # Check if this workflow should run based on changed files
  check-changes:
    name: Check Changed Files
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should-run: ${{ steps.filter.outputs.auth-app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for PR comparison
      
      - name: Check if relevant files changed
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            auth-app:
              - 'SDMSApps/SDMS.AuthenticationWebApp/**'
              - '.github/workflows/ci-authentication-webapp.yml'
          list-files: shell

  lint:
    name: Lint Code
    needs: check-changes
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only fetch current commit (saves time and Actions minutes)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache-dotnet: true  # Cache .NET dependencies (saves Actions minutes)

      - name: Install .NET format tool
        run: dotnet tool install -g dotnet-format
        continue-on-error: true  # Don't fail if already installed

      - name: Run dotnet format (check)
        working-directory: SDMSApps/SDMS.AuthenticationWebApp
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true

  build-dev:
    name: Build (Development)
    needs: check-changes
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Prevent long-running jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only fetch current commit (saves time and Actions minutes)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache-dotnet: true  # Cache .NET dependencies (saves Actions minutes)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SDMSApps/SDMS.AuthenticationWebApp/ClientApp/package.json

      - name: Install Angular dependencies
        working-directory: SDMSApps/SDMS.AuthenticationWebApp/ClientApp
        run: |
          # Use npm ci for faster, reliable installs (cache handles node_modules)
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Angular app (Development) - Build Node code first
        working-directory: SDMSApps/SDMS.AuthenticationWebApp/ClientApp
        env:
          # BREAKING CHANGE: No hardcoded defaults. Environment variables must be set.
          # These should be set as GitHub secrets or repository variables.
          # For local development, appsettings.json will be used as fallback.
          SDMS_AuthenticationWebApp_url: ${{ secrets.SDMS_AuthenticationWebApp_url || vars.SDMS_AuthenticationWebApp_url }}
          SDMS_AuthenticationWebApp_clientid: ${{ secrets.SDMS_AuthenticationWebApp_clientid || vars.SDMS_AuthenticationWebApp_clientid }}
        run: npm run build

      - name: Restore .NET dependencies
        working-directory: SDMSApps/SDMS.AuthenticationWebApp
        run: dotnet restore

      - name: Build .NET app (Development)
        working-directory: SDMSApps/SDMS.AuthenticationWebApp
        run: dotnet build --configuration Debug --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-auth
          path: |
            SDMSApps/SDMS.AuthenticationWebApp/bin/Debug
            SDMSApps/SDMS.AuthenticationWebApp/ClientApp/dist
          retention-days: 1
          compression-level: 6
          if-no-files-found: ignore

  build-prod:
    name: Build (Production)
    needs: check-changes
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Prevent long-running jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only fetch current commit (saves time and Actions minutes)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache-dotnet: true  # Cache .NET dependencies (saves Actions minutes)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SDMSApps/SDMS.AuthenticationWebApp/ClientApp/package.json

      - name: Install Angular dependencies
        working-directory: SDMSApps/SDMS.AuthenticationWebApp/ClientApp
        run: |
          # Use npm ci for faster, reliable installs (cache handles node_modules)
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Angular app (Production) - Build Node code first
        working-directory: SDMSApps/SDMS.AuthenticationWebApp/ClientApp
        env:
          # BREAKING CHANGE: No hardcoded defaults. Environment variables must be set.
          # These should be set as GitHub secrets or repository variables.
          # For local development, appsettings.json will be used as fallback.
          SDMS_AuthenticationWebApp_url: ${{ secrets.SDMS_AuthenticationWebApp_url || vars.SDMS_AuthenticationWebApp_url }}
          SDMS_AuthenticationWebApp_clientid: ${{ secrets.SDMS_AuthenticationWebApp_clientid || vars.SDMS_AuthenticationWebApp_clientid }}
        run: npm run build:prod

      - name: Restore .NET dependencies
        working-directory: SDMSApps/SDMS.AuthenticationWebApp
        run: dotnet restore

      - name: Build .NET app (Production)
        working-directory: SDMSApps/SDMS.AuthenticationWebApp
        run: dotnet build --configuration Release --no-restore

      - name: Publish .NET app
        working-directory: SDMSApps/SDMS.AuthenticationWebApp
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-prod-auth
          path: |
            SDMSApps/SDMS.AuthenticationWebApp/publish
            SDMSApps/SDMS.AuthenticationWebApp/ClientApp/dist
          retention-days: 3  # Reduced from 7 to save storage
          compression-level: 6
          if-no-files-found: ignore

  test:
    name: Run Unit Tests
    needs: check-changes
    if: needs.check-changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Prevent long-running jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only fetch current commit (saves time and Actions minutes)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache-dotnet: true  # Cache .NET dependencies (saves Actions minutes)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SDMSApps/SDMS.AuthenticationWebApp/ClientApp/package.json

      - name: Install Angular dependencies
        working-directory: SDMSApps/SDMS.AuthenticationWebApp/ClientApp
        run: |
          # Use npm ci for faster, reliable installs (cache handles node_modules)
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run .NET tests (if any)
        working-directory: SDMSApps/SDMS.AuthenticationWebApp
        run: |
          # Find and run test projects
          find . -name "*.Tests.csproj" -o -name "*Test.csproj" | while read testproj; do
            if [ -f "$testproj" ]; then
              dotnet test "$testproj" --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
            fi
          done
        continue-on-error: true

      - name: Run Angular tests
        working-directory: SDMSApps/SDMS.AuthenticationWebApp/ClientApp
        run: |
          if [ -f "package.json" ]; then
            if grep -q '"test:ci"' package.json; then
              npm run test:ci || echo "Tests failed (non-blocking)"
            else
              npm test -- --watch=false --browsers=ChromeHeadless --code-coverage || echo "Tests failed (non-blocking)"
            fi
          else
            echo "No Angular tests found, skipping"
          fi
        continue-on-error: true

      - name: Build .NET app (if needed for tests)
        working-directory: SDMSApps/SDMS.AuthenticationWebApp
        run: |
          # Only build if there are .NET test projects
          if find . -name "*.Tests.csproj" -o -name "*Test.csproj" | grep -q .; then
            dotnet build --configuration Release --no-restore
          else
            echo "No .NET test projects found, skipping build"
          fi
        continue-on-error: true

      - name: Upload .NET test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results-auth
          path: "SDMSApps/SDMS.AuthenticationWebApp/**/TestResults/*.trx"
          retention-days: 3  # Reduced from 7 to save storage
          compression-level: 6
          if-no-files-found: ignore

      - name: Upload Angular test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-test-results-auth
          path: SDMSApps/SDMS.AuthenticationWebApp/ClientApp/coverage
          retention-days: 3  # Reduced from 7 to save storage
          compression-level: 6
          if-no-files-found: ignore

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [check-changes, lint, build-dev, build-prod, test]
    if: always() && needs.check-changes.outputs.should-run == 'true'
    timeout-minutes: 2  # Very quick status check
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.build-dev.result }}" == "failure" ] || \
             [ "${{ needs.build-prod.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ]; then
            echo "CI checks failed"
            exit 1
          else
            echo "All CI checks passed"
          fi

