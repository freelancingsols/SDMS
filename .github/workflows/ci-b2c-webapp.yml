name: CI - B2C WebApp (Build, Test, and Lint)

# Concurrency: Cancel in-progress runs when a new one starts (saves Actions minutes)
concurrency:
  group: ci-b2c-webapp-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches:
      # Release and Stage branches: Always run CI on any push (no paths filter)
      # This ensures CI runs when PRs are merged, even if paths filter might miss merge commits
      - release
      - Release
      - stage
      - Stage
      - staging
      - Staging
      # Other branches: Run CI only when relevant files change (paths filter to save Actions minutes)
      - main
      - master
      - develop
    # No paths filter for push events - CI runs on all changes
    # This ensures CI runs on release/stage branches even if changes are outside app directories
  pull_request:
    branches:
      - '**'  # Run on PRs targeting any branch
    paths:
      - 'SDMSApps/SDMS.B2CWebApp/**'
      - '.github/workflows/ci-b2c-webapp.yml'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Prevent long-running jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only fetch current commit (saves time and Actions minutes)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SDMSApps/SDMS.B2CWebApp/ClientApp/package.json

      - name: Install dependencies
        working-directory: SDMSApps/SDMS.B2CWebApp/ClientApp
        run: |
          # Use npm ci for faster, reliable installs (cache handles node_modules)
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Angular Lint
        working-directory: SDMSApps/SDMS.B2CWebApp/ClientApp
        run: |
          # Check if lint script exists in package.json
          if npm run lint --dry-run 2>/dev/null | grep -q "lint"; then
            echo "Running npm run lint..."
            npm run lint || echo "Linting issues found (non-blocking)"
          elif command -v ng &> /dev/null; then
            echo "Running ng lint..."
            ng lint || echo "Linting issues found (non-blocking)"
          else
            echo "Lint not configured, skipping"
          fi
        continue-on-error: true

  build-dev:
    name: Build (Development)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent long-running jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only fetch current commit (saves time and Actions minutes)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SDMSApps/SDMS.B2CWebApp/ClientApp/package.json

      - name: Install dependencies
        working-directory: SDMSApps/SDMS.B2CWebApp/ClientApp
        run: |
          # Use npm ci for faster, reliable installs (cache handles node_modules)
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Angular app (Development)
        working-directory: SDMSApps/SDMS.B2CWebApp/ClientApp
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dev-b2c
          path: SDMSApps/SDMS.B2CWebApp/ClientApp/dist
          retention-days: 1
          compression-level: 6  # Balance between size and speed

  build-prod:
    name: Build (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent long-running jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only fetch current commit (saves time and Actions minutes)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SDMSApps/SDMS.B2CWebApp/ClientApp/package.json

      - name: Install dependencies
        working-directory: SDMSApps/SDMS.B2CWebApp/ClientApp
        run: |
          # Use npm ci for faster, reliable installs (cache handles node_modules)
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Angular app (Production)
        working-directory: SDMSApps/SDMS.B2CWebApp/ClientApp
        env:
          # BREAKING CHANGE: No hardcoded defaults. Environment variables must be set.
          # These should be set as GitHub secrets or repository variables.
          SDMS_B2CWebApp_url: ${{ secrets.SDMS_B2CWebApp_url || vars.SDMS_B2CWebApp_url }}
          SDMS_AuthenticationWebApp_url: ${{ secrets.SDMS_AuthenticationWebApp_url || vars.SDMS_AuthenticationWebApp_url }}
          SDMS_AuthenticationWebApp_clientid: ${{ secrets.SDMS_AuthenticationWebApp_clientid || vars.SDMS_AuthenticationWebApp_clientid }}
          SDMS_AuthenticationWebApp_redirectUri: ${{ secrets.SDMS_AuthenticationWebApp_redirectUri || vars.SDMS_AuthenticationWebApp_redirectUri }}
          SDMS_AuthenticationWebApp_scope: ${{ secrets.SDMS_AuthenticationWebApp_scope || vars.SDMS_AuthenticationWebApp_scope }}
        run: |
          node build-env.js
          npm run build:prod

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-prod-b2c
          path: SDMSApps/SDMS.B2CWebApp/ClientApp/dist
          retention-days: 3  # Reduced from 7 to save storage
          compression-level: 6

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent long-running jobs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only fetch current commit (saves time and Actions minutes)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: SDMSApps/SDMS.B2CWebApp/ClientApp/package.json

      - name: Install dependencies
        working-directory: SDMSApps/SDMS.B2CWebApp/ClientApp
        run: |
          # Use npm ci for faster, reliable installs (cache handles node_modules)
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run unit tests
        working-directory: SDMSApps/SDMS.B2CWebApp/ClientApp
        run: npm run test:ci
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-b2c
          path: SDMSApps/SDMS.B2CWebApp/ClientApp/coverage
          retention-days: 3  # Reduced from 7 to save storage
          compression-level: 6
          if-no-files-found: ignore

  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, build-dev, build-prod, test]
    if: always()
    timeout-minutes: 2  # Very quick status check
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.build-dev.result }}" == "failure" ] || \
             [ "${{ needs.build-prod.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ]; then
            echo "CI checks failed"
            exit 1
          else
            echo "All CI checks passed"
          fi
