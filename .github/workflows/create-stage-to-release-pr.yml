name: Create PR from Stage to Release

# Concurrency: Cancel in-progress runs when a new one starts
concurrency:
  group: create-pr-stage-to-release
  cancel-in-progress: true

# Auto-triggers on any push to stage branch, or manual dispatch
on:
  push:
    branches:
      - stage
      - Stage
  workflow_dispatch:
    inputs:
      check_ci:
        description: 'Check if CI workflows passed before creating PR'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Reduced from 10 to save Actions minutes
    permissions:
      contents: write  # Needed to create PRs
      pull-requests: write  # Needed to create/update PRs
      actions: read  # Needed to read workflow runs (if CI check is enabled)

    steps:
      - name: Summary
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║        Create PR from Stage to Release                     ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📋 Purpose: Create/update PR from stage → release"
          echo "🌿 Source Branch: stage"
          echo "🎯 Target Branch: release"
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "🔍 Triggered by: Auto (push to stage branch)"
            echo "🌿 Branch: ${{ github.ref_name }}"
            echo "🔖 Commit: ${{ github.sha }}"
            echo "👤 Author: ${{ github.event.head_commit.author.name }}"
            echo "📝 Message: ${{ github.event.head_commit.message }}"
            echo "🔍 CI Check: Will wait for CI if running"
          else
            echo "🔍 Triggered by: Manual dispatch"
            echo "🔍 CI Check: ${{ github.event.inputs.check_ci }}"
          fi
          echo ""

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for branch comparison
          token: ${{ secrets.GH_TOKEN_PR }}

      - name: Check CI workflow status (no waiting)
        id: check-ci
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_PR }}
        run: |
          echo "🔍 Checking CI workflow status for stage branch (no waiting)..."
          echo ""
          
          PUSH_SHA="${{ github.sha }}"
          
          echo "📋 Commit SHA: $PUSH_SHA"
          echo "ℹ️  Checking CI status but not waiting - will create PR immediately"
          echo ""
          
          # Workflows to check
          WORKFLOWS=("CI - B2C WebApp (Build, Test, and Lint)" "CI - Authentication WebApp (Build, Test, and Lint)")
          ALL_PASSED=true
          ANY_FOUND=false
          ANY_RUNNING=false
          
          for WORKFLOW in "${WORKFLOWS[@]}"; do
            # Get the latest workflow run for this commit
            RUN_DATA=$(gh run list \
              --branch stage \
              --workflow "$WORKFLOW" \
              --limit 5 \
              --json conclusion,status,headSha,workflowName \
              --jq ".[] | select(.headSha == \"$PUSH_SHA\") | ." 2>/dev/null | head -1) || RUN_DATA=""
            
            if [ -z "$RUN_DATA" ] || [ "$RUN_DATA" == "null" ] || [ "$RUN_DATA" == "" ]; then
              # No run found for this commit - CI may not have started yet
              echo "  ⏭️  $WORKFLOW: Not found for this commit (CI may not have started)"
              ANY_FOUND=false
            else
              ANY_FOUND=true
              STATUS=$(echo "$RUN_DATA" | jq -r '.status // "unknown"' 2>/dev/null || echo "unknown")
              CONCLUSION=$(echo "$RUN_DATA" | jq -r '.conclusion // "unknown"' 2>/dev/null || echo "unknown")
              
              if [ "$STATUS" == "completed" ]; then
                if [ "$CONCLUSION" == "success" ]; then
                  echo "  ✅ $WORKFLOW: Passed"
                else
                  echo "  ❌ $WORKFLOW: Failed (conclusion: $CONCLUSION)"
                  ALL_PASSED=false
                fi
              else
                echo "  ⏳ $WORKFLOW: Running (status: $STATUS)"
                ANY_RUNNING=true
              fi
            fi
          done
          
          echo ""
          
          if [ "$ANY_FOUND" == "true" ]; then
            if [ "$ALL_PASSED" == "true" ] && [ "$ANY_RUNNING" != "true" ]; then
              echo "✅ All CI workflows completed successfully!"
              echo "ci_status=success" >> $GITHUB_OUTPUT
            elif [ "$ANY_RUNNING" == "true" ]; then
              echo "⏳ Some CI workflows are still running"
              echo "   Proceeding with PR creation (will update when CI completes)"
              echo "ci_status=running" >> $GITHUB_OUTPUT
            else
              echo "❌ Some CI workflows failed"
              echo "   Proceeding with PR creation (CI status will be noted)"
              echo "ci_status=failed" >> $GITHUB_OUTPUT
            fi
          else
            echo "ℹ️  No CI workflows found for this commit"
            echo "   CI may not have started yet - proceeding with PR creation"
            echo "ci_status=not_found" >> $GITHUB_OUTPUT
          fi
          
          echo "ci_ready=true" >> $GITHUB_OUTPUT
          echo ""

      - name: Check if PR already exists (early exit)
        id: check-pr-early
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_PR }}
        run: |
          echo "🔍 Checking if PR from stage to release already exists..."
          
          # Quick check - no checkout needed, saves Actions minutes
          PR_DATA=$(gh pr list \
            --base release \
            --head stage \
            --state open \
            --json number,title,url,state \
            --limit 1 2>&1) || PR_DATA=""
          
          if [ -z "$PR_DATA" ] || [ "$PR_DATA" == "[]" ]; then
            echo "✅ No existing PR found - continuing workflow"
            echo "pr_exists=false" >> $GITHUB_OUTPUT
          else
            PR_NUMBER=$(echo "$PR_DATA" | jq -r '.[0].number' 2>/dev/null || echo "")
            PR_TITLE=$(echo "$PR_DATA" | jq -r '.[0].title' 2>/dev/null || echo "")
            PR_URL=$(echo "$PR_DATA" | jq -r '.[0].url' 2>/dev/null || echo "")
            
            if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
              echo "📋 Existing PR found:"
              echo "  Number: #$PR_NUMBER"
              echo "  Title: $PR_TITLE"
              echo "  URL: $PR_URL"
              echo ""
              echo "ℹ️  PR already exists. Checking if there are new commits to merge..."
              
              # Quick check if branches are in sync (minimal git operations)
              # We'll do a shallow checkout just to check commit count
              echo "pr_exists=true" >> $GITHUB_OUTPUT
              echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
              echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            else
              echo "✅ No existing PR found - continuing workflow"
              echo "pr_exists=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Checkout for sync check (minimal)
        id: checkout-sync
        if: steps.check-pr-early.outputs.pr_exists == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Minimal fetch to save time
          token: ${{ secrets.GH_TOKEN_PR }}

      - name: Quick check if branches are in sync (early exit)
        id: check-sync
        if: steps.check-pr-early.outputs.pr_exists == 'true'
        run: |
          echo "🔍 Quick check: Are stage and release branches in sync?"
          
          # Fetch only the refs we need (minimal network)
          git fetch origin stage:refs/remotes/origin/stage release:refs/remotes/origin/release --depth=1 2>&1 || true
          
          # Check if branches exist
          if ! git show-ref --verify --quiet refs/remotes/origin/stage; then
            echo "❌ Error: stage branch does not exist"
            exit 1
          fi
          
          if ! git show-ref --verify --quiet refs/remotes/origin/release; then
            echo "⚠️  release branch does not exist - will be created later"
            echo "branches_synced=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Quick commit count check (minimal computation)
          COMMIT_COUNT=$(git rev-list --count origin/release..origin/stage 2>/dev/null || echo "0")
          
          if [ "$COMMIT_COUNT" == "0" ]; then
            echo "✅ Branches are in sync - no commits to merge"
            echo "⏭️  Cancelling workflow early to save Actions minutes"
            echo "branches_synced=true" >> $GITHUB_OUTPUT
          else
            echo "📝 Found $COMMIT_COUNT commit(s) to merge - continuing workflow"
            echo "branches_synced=false" >> $GITHUB_OUTPUT
          fi

      - name: Cancel if PR exists and branches are synced
        if: steps.check-pr-early.outputs.pr_exists == 'true' && steps.check-sync.outputs.branches_synced == 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║              Workflow Cancelled (Optimization)            ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "✅ PR already exists: ${{ steps.check-pr-early.outputs.pr_url }}"
          echo "✅ Branches are in sync - no commits to merge"
          echo ""
          echo "💡 This workflow was cancelled early to save Actions minutes."
          echo "   No action needed - existing PR is up to date."
          echo ""
          exit 0

      - name: Checkout code (only if needed)
        if: steps.check-pr-early.outputs.pr_exists != 'true' || steps.check-sync.outputs.branches_synced != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history only if we need to create/update PR
          token: ${{ secrets.GH_TOKEN_PR }}

      - name: Setup Git
        if: steps.check-pr-early.outputs.pr_exists != 'true' || steps.check-sync.outputs.branches_synced != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify and setup branches
        if: steps.check-pr-early.outputs.pr_exists != 'true' || steps.check-sync.outputs.branches_synced != 'true'
        run: |
          echo "🔍 Verifying branches exist..."
          
          # Fetch all branches (only if we're continuing)
          git fetch origin --all 2>&1 || true
          
          # Check if stage branch exists
          if ! git show-ref --verify --quiet refs/remotes/origin/stage; then
            echo "❌ Error: stage branch does not exist"
            echo "   Please create the 'stage' branch first"
            exit 1
          fi
          echo "✅ stage branch exists: $(git rev-parse origin/stage)"
          
          # Checkout stage branch to work with it
          git checkout stage || git checkout -b stage origin/stage
          git pull origin stage 2>&1 || true
          
          # Check if release branch exists, create it if it doesn't
          if ! git show-ref --verify --quiet refs/remotes/origin/release; then
            echo "⚠️  release branch does not exist"
            echo "📝 Creating release branch from stage..."
            
            # Create release branch from current stage
            git checkout -b release
            
            # Push release branch to origin
            git push -u origin release
            
            echo "✅ Created release branch from stage"
          else
            echo "✅ release branch exists: $(git rev-parse origin/release)"
            git fetch origin release:release 2>&1 || true
          fi
          
          echo ""
          echo "📋 Branch Status:"
          echo "  - stage: $(git rev-parse origin/stage 2>/dev/null || echo 'N/A')"
          echo "  - release: $(git rev-parse origin/release 2>/dev/null || echo 'N/A')"
          echo ""

      - name: Check if PR already exists (detailed)
        id: check-pr
        if: steps.check-pr-early.outputs.pr_exists != 'true' || steps.check-sync.outputs.branches_synced != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_PR }}
        run: |
          echo "🔍 Checking if PR from stage to release already exists..."
          
          # Use cached result from early check if available
          if [ "${{ steps.check-pr-early.outputs.pr_exists }}" == "true" ]; then
            echo "📋 Using result from early check"
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=${{ steps.check-pr-early.outputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "pr_url=${{ steps.check-pr-early.outputs.pr_url }}" >> $GITHUB_OUTPUT
          else
            # Get existing PRs from stage to release
            PR_DATA=$(gh pr list \
              --base release \
              --head stage \
              --state open \
              --json number,title,url,state \
              --limit 1 2>&1) || PR_DATA=""
            
            if [ -z "$PR_DATA" ] || [ "$PR_DATA" == "[]" ]; then
              echo "✅ No existing PR found"
              echo "pr_exists=false" >> $GITHUB_OUTPUT
            else
              PR_NUMBER=$(echo "$PR_DATA" | jq -r '.[0].number' 2>/dev/null || echo "")
              PR_TITLE=$(echo "$PR_DATA" | jq -r '.[0].title' 2>/dev/null || echo "")
              PR_URL=$(echo "$PR_DATA" | jq -r '.[0].url' 2>/dev/null || echo "")
              
              if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
                echo "📋 Existing PR found:"
                echo "  Number: #$PR_NUMBER"
                echo "  Title: $PR_TITLE"
                echo "  URL: $PR_URL"
                echo "pr_exists=true" >> $GITHUB_OUTPUT
                echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
                echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
              else
                echo "✅ No existing PR found"
                echo "pr_exists=false" >> $GITHUB_OUTPUT
              fi
            fi
          fi
          echo ""

      - name: Check CI workflows status (optional)
        id: check-ci-status
        if: |
          (steps.check-pr-early.outputs.pr_exists != 'true' || steps.check-sync.outputs.branches_synced != 'true') &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.check_ci == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_PR }}
        run: |
          echo "🔍 Checking if both CI workflows passed on stage branch..."
          
          # Initialize variables
          B2C_CONCLUSION="unknown"
          AUTH_CONCLUSION="unknown"
          B2C_PASSED=false
          AUTH_PASSED=false
          
          # Get the latest commit on stage branch (this is what we're checking CI for)
          STAGE_SHA=$(git rev-parse origin/stage)
          echo "Stage branch HEAD SHA: $STAGE_SHA"
          echo ""
          
          # Check B2C WebApp CI status for the current stage HEAD
          echo "📋 Checking B2C WebApp CI for stage branch..."
          # Use workflow name instead of filename for better matching
          B2C_CI=$(gh run list \
            --branch stage \
            --workflow "CI - B2C WebApp (Build, Test, and Lint)" \
            --limit 5 \
            --json conclusion,headSha,status,createdAt,workflowName \
            --jq '.[] | select(.headSha == "'"$STAGE_SHA"'") | .' 2>&1 | head -1) || B2C_CI=""
          
          # If no exact match, get the latest run (might be for a different commit)
          if [ -z "$B2C_CI" ] || [ "$B2C_CI" == "null" ] || [ "$B2C_CI" == "" ]; then
            echo "  ℹ️  No CI run found for exact commit, checking latest run..."
            B2C_CI=$(gh run list \
              --branch stage \
              --workflow "CI - B2C WebApp (Build, Test, and Lint)" \
              --limit 1 \
              --json conclusion,headSha,status,workflowName \
              --jq '.[0]' 2>&1) || B2C_CI=""
          fi
          
          if [ -z "$B2C_CI" ] || [ "$B2C_CI" == "null" ] || [ "$B2C_CI" == "" ]; then
            echo "⚠️  No B2C WebApp CI run found for stage branch"
            B2C_CONCLUSION="not_found"
            B2C_PASSED=false
          else
            B2C_CONCLUSION=$(echo "$B2C_CI" | jq -r '.conclusion // "unknown"' 2>/dev/null || echo "unknown")
            B2C_SHA=$(echo "$B2C_CI" | jq -r '.headSha // ""' 2>/dev/null || echo "")
            echo "  Conclusion: $B2C_CONCLUSION"
            echo "  SHA: $B2C_SHA"
            
            if [ "$B2C_CONCLUSION" == "success" ]; then
              echo "  ✅ B2C WebApp CI passed"
              B2C_PASSED=true
            else
              echo "  ❌ B2C WebApp CI did not pass (conclusion: $B2C_CONCLUSION)"
              B2C_PASSED=false
            fi
          fi
          echo "b2c_ci_passed=$B2C_PASSED" >> $GITHUB_OUTPUT
          echo ""
          
          # Check Authentication WebApp CI status for the current stage HEAD
          echo "📋 Checking Authentication WebApp CI for stage branch..."
          # Use workflow name instead of filename for better matching
          AUTH_CI=$(gh run list \
            --branch stage \
            --workflow "CI - Authentication WebApp (Build, Test, and Lint)" \
            --limit 5 \
            --json conclusion,headSha,status,createdAt,workflowName \
            --jq '.[] | select(.headSha == "'"$STAGE_SHA"'") | .' 2>&1 | head -1) || AUTH_CI=""
          
          # If no exact match, get the latest run (might be for a different commit)
          if [ -z "$AUTH_CI" ] || [ "$AUTH_CI" == "null" ] || [ "$AUTH_CI" == "" ]; then
            echo "  ℹ️  No CI run found for exact commit, checking latest run..."
            AUTH_CI=$(gh run list \
              --branch stage \
              --workflow "CI - Authentication WebApp (Build, Test, and Lint)" \
              --limit 1 \
              --json conclusion,headSha,status,workflowName \
              --jq '.[0]' 2>&1) || AUTH_CI=""
          fi
          
          if [ -z "$AUTH_CI" ] || [ "$AUTH_CI" == "null" ] || [ "$AUTH_CI" == "" ]; then
            echo "⚠️  No Authentication WebApp CI run found for stage branch"
            AUTH_CONCLUSION="not_found"
            AUTH_PASSED=false
          else
            AUTH_CONCLUSION=$(echo "$AUTH_CI" | jq -r '.conclusion // "unknown"' 2>/dev/null || echo "unknown")
            AUTH_SHA=$(echo "$AUTH_CI" | jq -r '.headSha // ""' 2>/dev/null || echo "")
            echo "  Conclusion: $AUTH_CONCLUSION"
            echo "  SHA: $AUTH_SHA"
            
            if [ "$AUTH_CONCLUSION" == "success" ]; then
              echo "  ✅ Authentication WebApp CI passed"
              AUTH_PASSED=true
            else
              echo "  ❌ Authentication WebApp CI did not pass (conclusion: $AUTH_CONCLUSION)"
              AUTH_PASSED=false
            fi
          fi
          echo "auth_ci_passed=$AUTH_PASSED" >> $GITHUB_OUTPUT
          echo ""
          
          # Determine if we should create PR
          if [ "$B2C_PASSED" == "true" ] && [ "$AUTH_PASSED" == "true" ]; then
            echo "✅ Both CI workflows passed - PR can be created/updated"
            echo "ci_ready=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Not all CI workflows have passed yet:"
            echo "  B2C WebApp CI: $B2C_CONCLUSION (passed: $B2C_PASSED)"
            echo "  Authentication WebApp CI: $AUTH_CONCLUSION (passed: $AUTH_PASSED)"
            echo "  PR creation will be skipped"
            echo "ci_ready=false" >> $GITHUB_OUTPUT
          fi
          echo ""
      
      - name: Set CI ready status (auto-trigger - CI already passed)
        id: auto-ci-status
        if: |
          (steps.check-pr-early.outputs.pr_exists != 'true' || steps.check-sync.outputs.branches_synced != 'true') &&
          github.event_name == 'workflow_run'
        run: |
          echo "✅ CI check skipped - workflow was auto-triggered by successful CI"
          echo "   CI workflow: ${{ github.event.workflow_run.name }}"
          echo "   CI conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "ci_ready=true" >> $GITHUB_OUTPUT
          echo "b2c_ci_passed=auto-triggered" >> $GITHUB_OUTPUT
          echo "auth_ci_passed=auto-triggered" >> $GITHUB_OUTPUT

      - name: Set CI ready status (skip check - manual dispatch)
        id: skip-ci-status
        if: |
          (steps.check-pr-early.outputs.pr_exists != 'true' || steps.check-sync.outputs.branches_synced != 'true') &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.check_ci != 'true'
        run: |
          echo "⏭️  Skipping CI check (check_ci is false)"
          echo "ci_ready=true" >> $GITHUB_OUTPUT
          echo "b2c_ci_passed=skipped" >> $GITHUB_OUTPUT
          echo "auth_ci_passed=skipped" >> $GITHUB_OUTPUT

      - name: Create or update PR
        id: create-pr
        if: steps.check-pr-early.outputs.pr_exists != 'true' || steps.check-sync.outputs.branches_synced != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_PR }}
        run: |
          PR_EXISTS="${{ steps.check-pr.outputs.pr_exists }}"
          # Get CI ready status from check-ci-status, push-ci-status, or skip-ci-status step
          CI_READY="${{ steps.check-ci-status.outputs.ci_ready || steps.push-ci-status.outputs.ci_ready || steps.skip-ci-status.outputs.ci_ready }}"
          CHECK_CI="${{ github.event.inputs.check_ci }}"
          
          echo "📋 PR Creation Decision:"
          echo "  PR exists: $PR_EXISTS"
          echo "  CI check enabled: $CHECK_CI"
          echo "  CI ready: $CI_READY"
          echo ""
          
          # If CI check is enabled (manual dispatch) and CI is not ready, skip
          # Push-triggered workflows wait for CI automatically
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "$CHECK_CI" == "true" ] && [ "$CI_READY" != "true" ]; then
            echo "⏭️  Skipping PR creation: Not all CI workflows have passed"
            echo "   Re-run the workflow after CI passes, or disable CI check"
            exit 0
          fi
          
          # Check if there are commits to merge
          echo "📝 Checking if there are commits to merge..."
          COMMIT_COUNT=$(git rev-list --count origin/release..origin/stage 2>/dev/null || echo "0")
          
          if [ "$COMMIT_COUNT" == "0" ]; then
            echo ""
            echo "╔════════════════════════════════════════════════════════════╗"
            echo "║              No Action Needed - Branches Synced           ║"
            echo "╚════════════════════════════════════════════════════════════╝"
            echo ""
            echo "✅ Stage and release branches are already in sync"
            echo "   No commits to merge from stage → release"
            echo ""
            if [ "$PR_EXISTS" == "true" ]; then
              PR_NUMBER="${{ steps.check-pr.outputs.pr_number }}"
              PR_URL="${{ steps.check-pr.outputs.pr_url }}"
              echo "📋 Existing PR found: $PR_URL"
              echo "   The PR will be left as is (no changes to merge)"
              echo "   💡 You may want to close it manually if it's no longer needed"
            else
              echo "ℹ️  No PR exists and none is needed"
              echo "   This is expected when branches are in sync"
            fi
            echo ""
            echo "💡 Workflow completed successfully - no action required"
            echo ""
            # Exit successfully (0) - this is not an error condition
            exit 0
          fi
          
          echo "✅ Found $COMMIT_COUNT commit(s) to merge"
          echo ""
          
          # Get commit messages for PR body
          echo "📝 Gathering commit information..."
          COMMITS=$(git log origin/release..origin/stage --oneline --no-decorate | head -20)
          
          # Build CI status section
          CI_STATUS_SECTION=""
          if [ "${{ github.event_name }}" == "push" ]; then
            # Push-triggered - show CI status from check step
            CI_STATUS="${{ steps.check-ci.outputs.ci_status }}"
            if [ "$CI_STATUS" == "success" ]; then
              CI_STATUS_SECTION="### ✅ CI Status
          - ✅ B2C WebApp CI: Passed
          - ✅ Authentication WebApp CI: Passed
          - 🔖 Commit: ${{ github.sha }}
          
          "
            elif [ "$CI_STATUS" == "failed" ]; then
              CI_STATUS_SECTION="### ❌ CI Status
          - ❌ Some CI workflows failed
          - 🔖 Commit: ${{ github.sha }}
          - ⚠️  Please check CI workflow runs
          
          "
            elif [ "$CI_STATUS" == "running" ]; then
              CI_STATUS_SECTION="### ⏳ CI Status
          - ⏳ CI workflows are still running
          - 🔖 Commit: ${{ github.sha }}
          - ℹ️  PR created - CI status will update when workflows complete
          
          "
            elif [ "$CI_STATUS" == "not_found" ]; then
              CI_STATUS_SECTION="### ℹ️ CI Status
          - ℹ️ CI workflows not found for this commit
          - 🔖 Commit: ${{ github.sha }}
          - ℹ️  CI may not have started yet
          
          "
            else
              CI_STATUS_SECTION="### ⚠️ CI Status
          - ⚠️ CI Status: $CI_STATUS
          - 🔖 Commit: ${{ github.sha }}
          
          "
            fi
          elif [ "$CHECK_CI" == "true" ]; then
            B2C_STATUS="${{ steps.check-ci-status.outputs.b2c_ci_passed }}"
            AUTH_STATUS="${{ steps.check-ci-status.outputs.auth_ci_passed }}"
            if [ "$B2C_STATUS" == "true" ] && [ "$AUTH_STATUS" == "true" ]; then
              CI_STATUS_SECTION="### ✅ CI Status
          - ✅ B2C WebApp CI: Passed
          - ✅ Authentication WebApp CI: Passed
          
          "
            else
              CI_STATUS_SECTION="### ⚠️ CI Status
          - B2C WebApp CI: $B2C_STATUS
          - Authentication WebApp CI: $AUTH_STATUS
          
          "
            fi
          else
            CI_STATUS_SECTION="### ℹ️ CI Status
          - CI check was skipped/disabled for this PR
          
          "
          fi
          
          # Base title (will be updated with PR number after creation)
          BASE_TITLE="Release: Merge stage to release"
          PR_BODY="## PR from Stage to Release
          
          This PR was created to merge changes from \`stage\` branch to \`release\` branch.

          ### 📋 Summary
          - **Source Branch:** \`stage\`
          - **Target Branch:** \`release\`
          - **Commits:** $COMMIT_COUNT commit(s)
          
          $CI_STATUS_SECTION
          ### 📝 Recent Commits
          \`\`\`
          $COMMITS
          \`\`\`
          
          ### 🔍 Review Checklist
          - [ ] Review all changes
          - [ ] Verify CI workflows passed (if applicable)
          - [ ] Test deployment in staging environment
          - [ ] Approve and merge when ready
          
          ---
          *This PR was created by GitHub Actions workflow*"
          
          if [ "$PR_EXISTS" == "true" ]; then
            PR_NUMBER="${{ steps.check-pr.outputs.pr_number }}"
            PR_URL="${{ steps.check-pr.outputs.pr_url }}"
            
            echo "📋 Updating existing PR #$PR_NUMBER..."
            
            # Update PR title with number
            UPDATED_TITLE="Release PR #$PR_NUMBER: Merge stage to release"
            
            # Update PR body and title with latest information
            gh pr edit "$PR_NUMBER" \
              --body "$PR_BODY" \
              --title "$UPDATED_TITLE" 2>&1 || echo "⚠️  Could not update PR (might be unchanged)"
            
            echo "✅ PR updated: $PR_URL"
            echo "pr_created=false" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "pr_title=$UPDATED_TITLE" >> $GITHUB_OUTPUT
          else
            echo "🆕 Creating new PR from stage to release..."
            
            # Create the PR with base title (labels are optional)
            PR_RESULT=$(gh pr create \
              --base release \
              --head stage \
              --title "$BASE_TITLE" \
              --body "$PR_BODY" \
              --label "automated,release" 2>&1) || {
              # If creation fails due to labels, try without labels
              if echo "$PR_RESULT" | grep -qi "label"; then
                echo "⚠️  Label assignment failed, retrying without labels..."
                PR_RESULT=$(gh pr create \
                  --base release \
                  --head stage \
                  --title "$BASE_TITLE" \
                  --body "$PR_BODY" 2>&1) || {
                  echo "❌ Failed to create PR: $PR_RESULT"
                  exit 1
                }
              else
                echo "❌ Failed to create PR: $PR_RESULT"
                exit 1
              fi
            }
            
            # Extract PR URL and number from output
            PR_URL=$(echo "$PR_RESULT" | grep -o 'https://github.com[^ ]*' | head -1)
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '/pull/[0-9]+' | grep -oE '[0-9]+' || echo "")
            
            if [ -z "$PR_URL" ] || [ -z "$PR_NUMBER" ]; then
              echo "⚠️  Could not extract PR URL/number from output: $PR_RESULT"
              echo "   PR may have been created - please check manually"
              echo "pr_created=true" >> $GITHUB_OUTPUT
              echo "pr_number=unknown" >> $GITHUB_OUTPUT
              echo "pr_url=unknown" >> $GITHUB_OUTPUT
              echo "pr_title=$BASE_TITLE" >> $GITHUB_OUTPUT
            else
              echo "✅ PR created successfully! Updating title with PR number..."
              
              # Update PR title to include PR number
              UPDATED_TITLE="Release PR #$PR_NUMBER: Merge stage to release"
              gh pr edit "$PR_NUMBER" --title "$UPDATED_TITLE" 2>&1 || {
                echo "⚠️  Could not update PR title (PR was created with base title)"
                UPDATED_TITLE="$BASE_TITLE"
              }
              
              echo "✅ PR created and updated:"
              echo "  Number: #$PR_NUMBER"
              echo "  Title: $UPDATED_TITLE"
              echo "  URL: $PR_URL"
              
              echo "pr_created=true" >> $GITHUB_OUTPUT
              echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
              echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
              echo "pr_title=$UPDATED_TITLE" >> $GITHUB_OUTPUT
            fi
          fi
          echo ""

      - name: Summary
        if: always()
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║                    Workflow Summary                        ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          PR_CREATED="${{ steps.create-pr.outputs.pr_created }}"
          PR_NUMBER="${{ steps.create-pr.outputs.pr_number }}"
          PR_URL="${{ steps.create-pr.outputs.pr_url }}"
          
          # Check if workflow was cancelled early (branches synced)
          if [ "${{ steps.check-pr-early.outputs.pr_exists }}" == "true" ] && [ "${{ steps.check-sync.outputs.branches_synced }}" == "true" ]; then
            echo "✅ Workflow completed: PR exists and branches are synced"
            echo "   PR: ${{ steps.check-pr-early.outputs.pr_url }}"
            echo "   No action needed - branches are up to date"
          elif [ "$PR_CREATED" == "true" ]; then
            echo "✅ New PR created: $PR_URL"
          elif [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "" ]; then
            echo "✅ Existing PR updated: $PR_URL"
          elif [ "${{ steps.create-pr.outcome }}" == "skipped" ]; then
            echo "⏭️  PR creation step was skipped"
            echo "   This may happen if branches are synced or CI checks failed"
          else
            echo "ℹ️  No PR action taken"
            echo "   Branches may be in sync or conditions not met"
          fi
          echo ""
          echo "💡 Workflow completed successfully"
          echo ""


