name: Deploy Gateway API to Railway

# Concurrency: Cancel in-progress runs when a new one starts (saves Actions minutes)
concurrency:
  group: deploy-gateway-railway-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["CI - Gateway API (Build, Test, and Lint)"]
    types:
      - completed
    branches:
      - release
      - Release
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Prevent long-running jobs
    # Deployment rules:
    # 1. For workflow_run: Only deploy if CI succeeded AND CI ran on release branch
    # 2. For workflow_dispatch: Allow manual deployment from any branch
    if: |
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' && 
       (github.event.workflow_run.head_branch == 'release' || github.event.workflow_run.head_branch == 'Release')) ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Deployment Summary
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║           Gateway API Deployment to Railway                ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📦 Application: Gateway API"
          echo "🚀 Target Platform: Railway"
          echo "🌿 Trigger: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            echo "📋 CI Workflow: ${{ github.event.workflow_run.name }}"
            echo "🌿 CI Branch: ${{ github.event.workflow_run.head_branch }}"
            echo "✅ CI Status: ${{ github.event.workflow_run.conclusion }}"
            echo "🔖 CI Commit: ${{ github.event.workflow_run.head_sha }}"
          else
            echo "🌿 Branch: ${{ github.ref }}"
            echo "🔖 Commit: ${{ github.sha }}"
          fi
          echo ""
          echo "📝 Deployment will:"
          echo "   1. Verify CI status and release branch"
          echo "   2. Sync environment variables to Railway"
          echo "   3. Build .NET application"
          echo "   4. Deploy to Railway production"
          echo ""

      - name: Verify CI Status and Application
        if: github.event_name == 'workflow_run'
        run: |
          echo "🔍 Verifying CI workflow status for Gateway API deployment..."
          echo ""
          echo "📋 Deployment Information:"
          echo "  Application: Gateway API"
          echo "  Target: Railway"
          echo "  Workflow Run ID: ${{ github.event.workflow_run.id }}"
          echo "  CI Workflow: ${{ github.event.workflow_run.name }}"
          echo "  Workflow Run Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "  Workflow Run Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "  Workflow Run Commit SHA: ${{ github.event.workflow_run.head_sha }}"
          echo ""
          
          # Verify this is the correct CI workflow
          CI_WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          if [[ "$CI_WORKFLOW_NAME" != *"Gateway API"* ]]; then
            echo "⚠️  WARNING: This deployment is for Gateway API, but CI workflow name doesn't match: $CI_WORKFLOW_NAME"
            echo "   Expected: CI workflow should contain 'Gateway API'"
            echo "   Continuing anyway, but please verify this is the correct deployment."
          else
            echo "✅ Verified: This is the Gateway API CI workflow"
          fi
          echo ""
          
          # Verify branch is release
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [ "$BRANCH" != "release" ] && [ "$BRANCH" != "Release" ]; then
            echo "❌ Deployment cancelled: CI workflow ran on branch '$BRANCH', but deployment only runs from 'release' branch"
            echo "   Current branch: $BRANCH"
            echo "   Required branch: release or Release"
            exit 1
          fi
          echo "✅ Verified: CI workflow ran on release branch ($BRANCH)"
          echo ""
          
          # Verify CI succeeded
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          if [ "$CONCLUSION" != "success" ]; then
            echo "❌ CI workflow did not complete successfully. Deployment cancelled."
            echo "   Conclusion: $CONCLUSION"
            echo "   Only successful CI runs trigger deployment."
            exit 1
          fi
          echo "✅ Verified: CI workflow completed successfully"
          echo ""
          echo "🚀 All checks passed. Proceeding with Gateway API deployment to Railway..."

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # For workflow_run trigger, use the commit SHA from the CI workflow
          # For manual dispatch, use the default branch/ref
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 1  # Only fetch current commit (saves time and Actions minutes)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET dependencies
        working-directory: SDMSApps/SDMS.GatewayApi
        run: dotnet restore

      - name: Build .NET app
        working-directory: SDMSApps/SDMS.GatewayApi
        run: dotnet build --configuration Release --no-restore

      - name: Publish .NET app
        working-directory: SDMSApps/SDMS.GatewayApi
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Install Railway CLI (for deployment)
        run: npm install -g @railway/cli

      - name: Sync Railway environment variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: ${{ vars.RAILWAY_GATEWAY_SERVICE_ID }}
          PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          # Secrets
          logging_loki_token: ${{ secrets.logging_loki_token }}
          # Variables - Gateway API Configuration
          SDMS_GatewayApi_Authentication_Authority: ${{ vars.SDMS_GatewayApi_Authentication_Authority }}
          SDMS_GatewayApi_Authentication_Audience: ${{ vars.SDMS_GatewayApi_Authentication_Audience }}
          SDMS_GatewayApi_Cors_AllowedOrigins: ${{ vars.SDMS_GatewayApi_Cors_AllowedOrigins }}
          SDMS_GatewayApi_Service_Authentication_Url: ${{ vars.SDMS_GatewayApi_Service_Authentication_Url }}
          SDMS_GatewayApi_Service_Catalog_Url: ${{ vars.SDMS_GatewayApi_Service_Catalog_Url }}
          SDMS_GatewayApi_Service_ContentManagement_Url: ${{ vars.SDMS_GatewayApi_Service_ContentManagement_Url }}
          SDMS_GatewayApi_Service_Booking_Url: ${{ vars.SDMS_GatewayApi_Service_Booking_Url }}
          SDMS_GatewayApi_BaseUrl: ${{ vars.SDMS_GatewayApi_BaseUrl }}
          # Logging Configuration (Grafana Loki)
          logging_loki_url: ${{ vars.logging_loki_url }}
          logging_loki_user: ${{ vars.logging_loki_user }}
        working-directory: SDMSApps/SDMS.GatewayApi
        run: |
          echo "=== Debug: Environment Variables from GitHub ==="
          echo "Checking critical variables..."
          if [ -z "$SDMS_GatewayApi_Authentication_Authority" ]; then
            echo "  SDMS_GatewayApi_Authentication_Authority: ❌ EMPTY or NOT SET"
          else
            echo "  SDMS_GatewayApi_Authentication_Authority: ✅ SET (length: ${#SDMS_GatewayApi_Authentication_Authority})"
            echo "    Preview: ${SDMS_GatewayApi_Authentication_Authority:0:50}..."
          fi
          if [ -z "$SDMS_GatewayApi_Authentication_Audience" ]; then
            echo "  SDMS_GatewayApi_Authentication_Audience: ❌ EMPTY or NOT SET"
          else
            echo "  SDMS_GatewayApi_Authentication_Audience: ✅ SET (length: ${#SDMS_GatewayApi_Authentication_Audience})"
            echo "    Value: $SDMS_GatewayApi_Authentication_Audience"
          fi
          echo ""
          echo "=== Syncing Railway Environment Variables ==="
          echo "Service ID: $SERVICE_ID"
          echo "Project ID: $PROJECT_ID"
          echo "Environment ID: $ENVIRONMENT_ID"
          echo ""
          
          # Validate required environment variables
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "❌ RAILWAY_TOKEN missing. Add it to GitHub secrets."
            exit 1
          fi
          
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ RAILWAY_PROJECT_ID missing. Add it to GitHub variables."
            exit 1
          fi
          
          if [ -z "$SERVICE_ID" ]; then
            echo "❌ RAILWAY_GATEWAY_SERVICE_ID missing. Add it to GitHub variables."
            exit 1
          fi
          
          if [ -z "$ENVIRONMENT_ID" ]; then
            echo "❌ RAILWAY_ENVIRONMENT_ID missing. Add it to GitHub variables."
            exit 1
          fi
          
          # Verify token format
          TOKEN_PREFIX=$(echo "$RAILWAY_TOKEN" | cut -c1-8)
          TOKEN_LENGTH=${#RAILWAY_TOKEN}
          echo "✅ Token configured (length: $TOKEN_LENGTH, starts with: $TOKEN_PREFIX...)"
          echo ""
          
          # Railway GraphQL API endpoint
          RAILWAY_API="https://backboard.railway.app/graphql/v2"
          
          # Function to escape JSON string for GraphQL variables
          escape_json() {
            local input="$1"
            # Escape backslashes first
            input=$(echo "$input" | sed 's/\\/\\\\/g')
            # Escape double quotes
            input=$(echo "$input" | sed 's/"/\\"/g')
            # Escape newlines
            input=$(echo "$input" | sed 's/$/\\n/' | tr -d '\n' | sed 's/\\n$//')
            # Escape carriage returns
            input=$(echo "$input" | sed 's/\r/\\r/g')
            # Escape tabs
            input=$(echo "$input" | sed 's/\t/\\t/g')
            echo "$input"
          }
          
          # Function to get all Railway environment variables
          get_railway_variables() {
            echo "📥 Fetching current Railway environment variables..."
            
            # Compose GraphQL query
            GET_QUERY_PAYLOAD=$(printf '{"query":"query variables($environmentId: String!, $pluginId: String, $projectId: String!, $serviceId: String, $unrendered: Boolean) {\\n  variables(\\n    environmentId: $environmentId\\n    pluginId: $pluginId\\n    projectId: $projectId\\n    serviceId: $serviceId\\n    unrendered: $unrendered\\n  )\\n}","operationName":"variables","variables":{"pluginId":null,"unrendered":null,"projectId":"%s","environmentId":"%s","serviceId":"%s"}}' "$PROJECT_ID" "$ENVIRONMENT_ID" "$SERVICE_ID")
            
            # Send GraphQL query to get variables
            RESPONSE=$(curl -s -X POST "$RAILWAY_API" --max-time 30 -H "Project-Access-Token: $RAILWAY_TOKEN" -H "Content-Type: application/json" -d "$GET_QUERY_PAYLOAD" 2>&1)
            
            # Check for errors
            if echo "$RESPONSE" | grep -q "\"errors\""; then
              echo "❌ Error fetching Railway variables:"
              echo "$RESPONSE" | grep -o '"message":"[^"]*"' | head -1 | sed 's/"message":"\([^"]*\)"/\1/'
              return 1
            fi
            
            # Extract variables object from response
            echo "$RESPONSE" > /tmp/railway_variables.json
            
            # Count variables
            VAR_COUNT=$(echo "$RESPONSE" | grep -o '"[^"]*":"[^"]*"' | wc -l)
            echo "✅ Found $VAR_COUNT existing variable(s) in Railway"
            echo ""
            
            return 0
          }
          
          # Function to get variable value from Railway response
          get_railway_var_value() {
            local VAR_NAME="$1"
            if [ -f /tmp/railway_variables.json ]; then
              grep -o "\"$VAR_NAME\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" /tmp/railway_variables.json | sed "s/\"$VAR_NAME\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\"/\1/" | head -1
            fi
          }
          
          # Function to set Railway variable using GraphQL API
          set_railway_env() {
            local VAR_NAME=$1
            local VAR_VALUE=$2
            local ACTION=$3  # "insert" or "update"
            
            # Escape the value for JSON
            ESCAPED_VALUE=$(escape_json "$VAR_VALUE")
            
            if [ "$ACTION" = "insert" ]; then
              echo -n "  ➕ Inserting $VAR_NAME... "
            else
              echo -n "  🔄 Updating $VAR_NAME... "
            fi
            
            # Compose GraphQL mutation
            UPSERT_PAYLOAD=$(printf '{"query":"mutation variableUpsert($input: VariableUpsertInput!) {\\n  variableUpsert(input: $input)\\n}","operationName":"variableUpsert","variables":{"input":{"projectId":"%s","environmentId":"%s","serviceId":"%s","name":"%s","value":"%s"}}}' "$PROJECT_ID" "$ENVIRONMENT_ID" "$SERVICE_ID" "$VAR_NAME" "$ESCAPED_VALUE")
            
            # Send GraphQL upsert request
            HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/railway_upsert_response.json -X POST "$RAILWAY_API" --max-time 120 -H "Project-Access-Token: $RAILWAY_TOKEN" -H "Content-Type: application/json" -d "$UPSERT_PAYLOAD" 2>&1)
            
            CURL_EXIT=$?
            
            # Check response
            if [ "$HTTP_CODE" = "504" ] || [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "503" ]; then
              echo "✅ (HTTP $HTTP_CODE - Railway processing asynchronously)"
              sleep 1
              return 0
            elif [ $CURL_EXIT -eq 28 ]; then
              echo "✅ (timeout - Railway processing asynchronously)"
              sleep 1
              return 0
            elif [ "$HTTP_CODE" = "200" ]; then
              # Check for GraphQL errors
              if grep -q "\"errors\"" /tmp/railway_upsert_response.json 2>/dev/null; then
                ERROR_MSG=$(cat /tmp/railway_upsert_response.json | grep -o '"message":"[^"]*"' | head -1 | sed 's/"message":"\([^"]*\)"/\1/')
                if [ -n "$ERROR_MSG" ]; then
                  echo "❌ GraphQL Error: $ERROR_MSG"
                  return 1
                fi
              else
                echo "✅"
                return 0
              fi
            elif [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
              echo "❌ Authentication error (HTTP $HTTP_CODE)"
              echo "     💡 Verify RAILWAY_TOKEN is a valid Project Token"
              return 1
            else
              echo "⚠️  (HTTP $HTTP_CODE)"
              return 1
            fi
          }
          
          # Step 1: Get current Railway variables
          if ! get_railway_variables; then
            echo "❌ Failed to fetch Railway variables. Continuing with sync anyway..."
          fi
          
          # Step 2: Define all variables to sync (name -> GitHub secret/var name)
          declare -A VARS_TO_SYNC
          # Gateway API Configuration Variables
          VARS_TO_SYNC["SDMS_GatewayApi_Authentication_Authority"]="$SDMS_GatewayApi_Authentication_Authority"
          VARS_TO_SYNC["SDMS_GatewayApi_Authentication_Audience"]="$SDMS_GatewayApi_Authentication_Audience"
          VARS_TO_SYNC["SDMS_GatewayApi_Cors_AllowedOrigins"]="$SDMS_GatewayApi_Cors_AllowedOrigins"
          VARS_TO_SYNC["SDMS_GatewayApi_Service_Authentication_Url"]="$SDMS_GatewayApi_Service_Authentication_Url"
          VARS_TO_SYNC["SDMS_GatewayApi_Service_Catalog_Url"]="$SDMS_GatewayApi_Service_Catalog_Url"
          VARS_TO_SYNC["SDMS_GatewayApi_Service_ContentManagement_Url"]="$SDMS_GatewayApi_Service_ContentManagement_Url"
          VARS_TO_SYNC["SDMS_GatewayApi_Service_Booking_Url"]="$SDMS_GatewayApi_Service_Booking_Url"
          VARS_TO_SYNC["SDMS_GatewayApi_BaseUrl"]="$SDMS_GatewayApi_BaseUrl"
          # Logging Configuration (Grafana Loki)
          VARS_TO_SYNC["logging_loki_url"]="$logging_loki_url"
          VARS_TO_SYNC["logging_loki_user"]="$logging_loki_user"
          VARS_TO_SYNC["logging_loki_token"]="$logging_loki_token"
          
          # Step 3: Compare and sync
          echo "🔄 Comparing and syncing variables..."
          echo ""
          
          # Log GitHub Variable status for critical variables
          echo "📋 GitHub Variables Status:"
          echo "  SDMS_GatewayApi_Authentication_Authority: ${SDMS_GatewayApi_Authentication_Authority:-❌ NOT SET}"
          echo "  SDMS_GatewayApi_Authentication_Audience: ${SDMS_GatewayApi_Authentication_Audience:-❌ NOT SET}"
          echo "  SDMS_GatewayApi_Cors_AllowedOrigins: ${SDMS_GatewayApi_Cors_AllowedOrigins:-❌ NOT SET}"
          echo ""
          echo "📋 Service URLs Status:"
          echo "  SDMS_GatewayApi_Service_Authentication_Url: ${SDMS_GatewayApi_Service_Authentication_Url:-❌ NOT SET}"
          echo "  SDMS_GatewayApi_Service_Catalog_Url: ${SDMS_GatewayApi_Service_Catalog_Url:-❌ NOT SET}"
          echo "  SDMS_GatewayApi_Service_ContentManagement_Url: ${SDMS_GatewayApi_Service_ContentManagement_Url:-❌ NOT SET}"
          echo "  SDMS_GatewayApi_Service_Booking_Url: ${SDMS_GatewayApi_Service_Booking_Url:-❌ NOT SET}"
          echo ""
          echo "📋 Loki Configuration Status:"
          if [ -z "$logging_loki_url" ]; then
            echo "  logging_loki_url: ❌ NOT SET"
          else
            echo "  logging_loki_url: ✅ SET (${#logging_loki_url} chars)"
            echo "    Preview: ${logging_loki_url:0:50}..."
          fi
          if [ -z "$logging_loki_user" ]; then
            echo "  logging_loki_user: ❌ NOT SET"
          else
            echo "  logging_loki_user: ✅ SET (${#logging_loki_user} chars)"
            echo "    Value: $logging_loki_user"
          fi
          if [ -z "$logging_loki_token" ]; then
            echo "  logging_loki_token: ❌ NOT SET"
          else
            echo "  logging_loki_token: ✅ SET (${#logging_loki_token} chars)"
            echo "    Preview: ${logging_loki_token:0:20}..."
          fi
          echo ""
          
          # Track results
          INSERTED_VARS=()
          UPDATED_VARS=()
          UNCHANGED_VARS=()
          FAILED_VARS=()
          SKIPPED_VARS=()
          CRITICAL_FAILED=0
          
          # Process each variable
          echo "Processing ${#VARS_TO_SYNC[@]} variable(s) to sync..."
          echo ""
          echo "Variables in sync list:"
          for VAR_NAME in "${!VARS_TO_SYNC[@]}"; do
            GITHUB_VALUE="${VARS_TO_SYNC[$VAR_NAME]}"
            if [ -z "$GITHUB_VALUE" ]; then
              echo "  - $VAR_NAME: ❌ NOT SET in GitHub Variables"
            else
              # Show first 30 chars for security
              PREVIEW="${GITHUB_VALUE:0:30}"
              if [ ${#GITHUB_VALUE} -gt 30 ]; then
                PREVIEW="${PREVIEW}..."
              fi
              echo "  - $VAR_NAME: ✅ SET ($PREVIEW)"
            fi
          done
          echo ""
          echo "Starting sync process..."
          echo ""
          
          for VAR_NAME in "${!VARS_TO_SYNC[@]}"; do
            GITHUB_VALUE="${VARS_TO_SYNC[$VAR_NAME]}"
            
            # Skip if GitHub value is empty (optional variable)
            if [ -z "$GITHUB_VALUE" ]; then
              # Check if this is a critical variable
              if [ "$VAR_NAME" = "SDMS_GatewayApi_Authentication_Authority" ] || [ "$VAR_NAME" = "SDMS_GatewayApi_Authentication_Audience" ]; then
                echo "  ⚠️  WARNING: Skipping CRITICAL variable $VAR_NAME (not set in GitHub Variables)"
                echo "     This variable is required for Gateway API to work correctly!"
                echo "     Please set it in GitHub → Settings → Secrets and variables → Actions → Variables"
              elif [[ "$VAR_NAME" == logging_loki_* ]]; then
                echo "  ⚠️  WARNING: Skipping Loki variable $VAR_NAME (not set in GitHub Variables/Secrets)"
                echo "     This variable is required for logs to be sent to Grafana Loki!"
                echo "     Please set it in GitHub → Settings → Secrets and variables → Actions"
                if [ "$VAR_NAME" = "logging_loki_token" ]; then
                  echo "     Note: logging_loki_token should be set in Secrets (not Variables)"
                else
                  echo "     Note: $VAR_NAME should be set in Variables"
                fi
              else
                echo "  ⏭️  Skipping $VAR_NAME (not set in GitHub Variables - optional)"
              fi
              SKIPPED_VARS+=("$VAR_NAME")
              continue
            fi
            
            # Get current value from Railway
            RAILWAY_VALUE=$(get_railway_var_value "$VAR_NAME")
            
            # Function to mask sensitive values for logging
            mask_value() {
              local val="$1"
              local var_name="$2"
              # Mask secrets and tokens
              if [[ "$var_name" == *"Secret"* ]] || [[ "$var_name" == *"Token"* ]] || [[ "$var_name" == *"Password"* ]] || [[ "$var_name" == *"ConnectionString"* ]] || [[ "$var_name" == *"token"* ]]; then
                if [ ${#val} -gt 10 ]; then
                  echo "${val:0:4}...${val: -4}"
                else
                  echo "***"
                fi
              else
                # For non-secrets, show first 50 chars
                if [ ${#val} -gt 50 ]; then
                  echo "${val:0:50}..."
                else
                  echo "$val"
                fi
              fi
            }
            
            if [ -z "$RAILWAY_VALUE" ]; then
              # Variable doesn't exist - INSERT
              echo "  Processing $VAR_NAME..."
              echo "    GitHub: $(mask_value "$GITHUB_VALUE" "$VAR_NAME")"
              echo "    Railway: ❌ NOT SET"
              echo -n "    Action: INSERTING... "
              if set_railway_env "$VAR_NAME" "$GITHUB_VALUE" "insert"; then
                INSERTED_VARS+=("$VAR_NAME")
                echo "✅ INSERTED"
              else
                FAILED_VARS+=("$VAR_NAME")
                echo "❌ FAILED"
                if [ "$VAR_NAME" = "SDMS_GatewayApi_Authentication_Authority" ]; then
                  CRITICAL_FAILED=1
                fi
              fi
            elif [ "$RAILWAY_VALUE" != "$GITHUB_VALUE" ]; then
              # Variable exists but value is different - UPDATE
              echo "  Processing $VAR_NAME..."
              echo "    GitHub: $(mask_value "$GITHUB_VALUE" "$VAR_NAME")"
              echo "    Railway: $(mask_value "$RAILWAY_VALUE" "$VAR_NAME")"
              echo "    Status: ⚠️  VALUES DIFFER - UPDATE NEEDED"
              echo -n "    Action: UPDATING... "
              if set_railway_env "$VAR_NAME" "$GITHUB_VALUE" "update"; then
                UPDATED_VARS+=("$VAR_NAME")
                echo "✅ UPDATED"
              else
                FAILED_VARS+=("$VAR_NAME")
                echo "❌ FAILED"
                if [ "$VAR_NAME" = "SDMS_GatewayApi_Authentication_Authority" ]; then
                  CRITICAL_FAILED=1
                fi
              fi
            else
              # Variable exists and value is the same - SKIP
              echo "  Processing $VAR_NAME..."
              echo "    GitHub: $(mask_value "$GITHUB_VALUE" "$VAR_NAME")"
              echo "    Railway: $(mask_value "$RAILWAY_VALUE" "$VAR_NAME")"
              echo "    Status: ✅ VALUES MATCH - NO UPDATE NEEDED"
              echo "    Action: SKIPPED"
              UNCHANGED_VARS+=("$VAR_NAME")
            fi
            echo ""
          done
          
          # Summary
          echo ""
          echo "=== Sync Summary ==="
          echo "  ➕ Inserted: ${#INSERTED_VARS[@]} variable(s)"
          echo "  🔄 Updated: ${#UPDATED_VARS[@]} variable(s)"
          echo "  ✓ Unchanged: ${#UNCHANGED_VARS[@]} variable(s)"
          echo "  ⏭️  Skipped: ${#SKIPPED_VARS[@]} variable(s) (not set in GitHub)"
          echo "  ❌ Failed: ${#FAILED_VARS[@]} variable(s)"
          echo ""
          
          if [ ${#SKIPPED_VARS[@]} -gt 0 ]; then
            echo "Skipped variables (not set in GitHub Variables):"
            for var in "${SKIPPED_VARS[@]}"; do
              echo "   ⏭️  $var"
            done
            echo ""
          fi
          
          if [ ${#INSERTED_VARS[@]} -gt 0 ]; then
            echo "Inserted variables:"
            for var in "${INSERTED_VARS[@]}"; do
              echo "   ➕ $var"
            done
            echo ""
          fi
          
          if [ ${#UPDATED_VARS[@]} -gt 0 ]; then
            echo "Updated variables:"
            for var in "${UPDATED_VARS[@]}"; do
              echo "   🔄 $var"
            done
            echo ""
          fi
          
          if [ ${#FAILED_VARS[@]} -gt 0 ]; then
            echo "Failed variables:"
            for var in "${FAILED_VARS[@]}"; do
              echo "   ❌ $var"
            done
            echo ""
          fi
          
          if [ $CRITICAL_FAILED -eq 1 ]; then
            echo "❌ CRITICAL ERROR: Authentication Authority failed to set"
            echo "   Deployment cannot proceed without the authentication authority."
            echo "   Please set SDMS_GatewayApi_Authentication_Authority manually in Railway dashboard:"
            echo "   https://railway.app/project/$PROJECT_ID/service/$SERVICE_ID/variables"
            exit 1
          elif [ ${#FAILED_VARS[@]} -gt 0 ]; then
            echo "⚠️  Some variables failed to set, but deployment can continue"
            echo "   Please set failed variables manually in Railway dashboard:"
            echo "   https://railway.app/project/$PROJECT_ID/service/$SERVICE_ID/variables"
          else
            echo "✅ All environment variables synced successfully!"
          fi

      - name: Verify critical variables are set in Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          SERVICE_ID: ${{ vars.RAILWAY_GATEWAY_SERVICE_ID }}
        run: |
          echo "=== Verifying critical variables in Railway ==="
          
          # Wait a moment for Railway to propagate variables
          echo "Waiting 3 seconds for Railway to propagate variables..."
          sleep 3
          
          # Railway GraphQL API endpoint
          RAILWAY_API="https://backboard.railway.app/graphql/v2"
          
          # Function to get variable value from Railway
          get_railway_var() {
            local VAR_NAME="$1"
            GET_QUERY_PAYLOAD=$(printf '{"query":"query variables($environmentId: String!, $pluginId: String, $projectId: String!, $serviceId: String, $unrendered: Boolean) {\\n  variables(\\n    environmentId: $environmentId\\n    pluginId: $pluginId\\n    projectId: $projectId\\n    serviceId: $serviceId\\n    unrendered: $unrendered\\n  )\\n}","operationName":"variables","variables":{"pluginId":null,"unrendered":null,"projectId":"%s","environmentId":"%s","serviceId":"%s"}}' "$PROJECT_ID" "$ENVIRONMENT_ID" "$SERVICE_ID")
            RESPONSE=$(curl -s -X POST "$RAILWAY_API" --max-time 30 -H "Project-Access-Token: $RAILWAY_TOKEN" -H "Content-Type: application/json" -d "$GET_QUERY_PAYLOAD" 2>&1)
            if echo "$RESPONSE" | grep -q "\"errors\""; then
              echo "ERROR"
              return 1
            fi
            echo "$RESPONSE" | grep -o "\"$VAR_NAME\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" | sed "s/\"$VAR_NAME\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\"/\1/" | head -1
          }
          
          # Check critical variables
          CRITICAL_VARS=("SDMS_GatewayApi_Authentication_Authority" "SDMS_GatewayApi_Authentication_Audience")
          MISSING_VARS=()
          
          for VAR_NAME in "${CRITICAL_VARS[@]}"; do
            echo -n "Checking $VAR_NAME... "
            VAR_VALUE=$(get_railway_var "$VAR_NAME")
            if [ -z "$VAR_VALUE" ] || [ "$VAR_VALUE" = "ERROR" ]; then
              echo "❌ NOT SET"
              MISSING_VARS+=("$VAR_NAME")
            else
              # Check if it's localhost (which would be wrong)
              if echo "$VAR_VALUE" | grep -q "localhost"; then
                echo "⚠️  SET BUT IS LOCALHOST: $VAR_VALUE"
                echo "   This should be your production Railway URL!"
                MISSING_VARS+=("$VAR_NAME (set to localhost)")
              else
                echo "✅ SET: ${VAR_VALUE:0:50}..."
              fi
            fi
          done
          
          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo ""
            echo "❌ CRITICAL ERROR: Required variables are missing or incorrect in Railway!"
            echo "   Missing/Incorrect: ${MISSING_VARS[*]}"
            echo ""
            echo "   These variables are required for the Gateway API to work correctly."
            echo "   Please set them in Railway dashboard → Variables tab:"
            echo "   https://railway.app/project/$PROJECT_ID/service/$SERVICE_ID/variables"
            echo ""
            echo "   Or ensure they are set in GitHub Variables and the sync step completed successfully."
            exit 1
          else
            echo ""
            echo "✅ All critical variables verified in Railway!"
          fi

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        working-directory: SDMSApps/SDMS.GatewayApi
        run: |
          echo "=== Deploying to Railway ==="
          n=0
          until [ "$n" -ge 3 ]
          do
            railway up --service ${{ vars.RAILWAY_GATEWAY_SERVICE_ID }} && break
            n=$((n+1))
            echo "Retry #$n for railway up..."
            sleep 10
          done
          if [ "$n" -eq 3 ]; then
            echo "❌ Deployment failed after 3 attempts."
            exit 1
          fi
          echo "✅ Deployment complete."

