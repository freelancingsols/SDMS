# Railway uses Nixpacks for .NET builds
# This file configures the build process

[phases.setup]
nixPkgs = ["dotnet-sdk_8"]

[phases.install]
cmds = [
  "echo 'Installing Node.js 20 using fnm...'",
  "curl -fsSL https://fnm.vercel.app/install | bash",
  "export PATH=\"$HOME/.local/share/fnm:$PATH\"",
  "eval \"$(fnm env --use-on-cd)\"",
  "fnm install 20",
  "fnm use 20",
  "fnm alias 20 default",
  "export PATH=\"$HOME/.local/share/fnm:$PATH\" && eval \"$(fnm env)\" && node --version && npm --version",
  "export PATH=\"$HOME/.local/share/fnm:$PATH\" && eval \"$(fnm env)\" && cd ClientApp && npm install --legacy-peer-deps && cd .. && dotnet restore"
]

[phases.build]
# Railway environment variables should be available during build
# If they're not set, the build will fail with a clear error message
cmds = [
  "echo '🔧 Building Angular ClientApp with environment variables...'",
  "echo ''",
  "echo '=== Checking Railway Environment Variables ==='",
  "echo 'SDMS_AuthenticationWebApp_url='${SDMS_AuthenticationWebApp_url:-NOT_SET}",
  "echo 'SDMS_AuthenticationWebApp_clientid='${SDMS_AuthenticationWebApp_clientid:-NOT_SET}",
  "echo 'RAILWAY_ENVIRONMENT='${RAILWAY_ENVIRONMENT:-NOT_SET}",
  "echo 'RAILWAY_PROJECT_ID='${RAILWAY_PROJECT_ID:-NOT_SET}",
  "echo 'PORT='${PORT:-NOT_SET}",
  "echo ''",
  "[ -z \"${SDMS_AuthenticationWebApp_url}\" ] && echo '❌ ERROR: SDMS_AuthenticationWebApp_url environment variable is not set!' && echo '   Please set this variable in Railway Dashboard → Variables tab' && echo '   Variable name: SDMS_AuthenticationWebApp_url' && echo '   Value should be: https://sdms-production.up.railway.app (or your Railway URL)' && exit 1 || true",
  "[ -z \"${SDMS_AuthenticationWebApp_clientid}\" ] && echo '❌ ERROR: SDMS_AuthenticationWebApp_clientid environment variable is not set!' && echo '   Please set this variable in Railway Dashboard → Variables tab' && echo '   Variable name: SDMS_AuthenticationWebApp_clientid' && echo '   Value should be: sdms_frontend' && exit 1 || true",
  "echo '✅ Environment variables are set'",
  "echo ''",
  "echo '=== Verifying Node.js version ==='",
  "export PATH=\"$HOME/.local/share/fnm:$PATH\"",
  "eval \"$(fnm env)\"",
  "node --version",
  "npm --version",
  "echo ''",
  "echo '=== Starting Angular Build ==='",
  "export PATH=\"$HOME/.local/share/fnm:$PATH\" && eval \"$(fnm env)\" && cd ClientApp && npm run build:prod && cd ..",
  "dotnet build -c Release",
  "dotnet publish -c Release -o ./publish",
  "echo 'Copying Angular dist files...'",
  "mkdir -p ./publish/ClientApp/dist/sdms-auth-client",
  "if [ -d 'ClientApp/dist/sdms-auth-client' ]; then cp -r ClientApp/dist/sdms-auth-client/. ./publish/ClientApp/dist/sdms-auth-client/; echo 'Angular files copied successfully'; else echo 'ERROR: Angular dist directory not found!'; ls -la ClientApp/ || true; ls -la ClientApp/dist/ || true; exit 1; fi"
]

[start]
cmd = "dotnet ./publish/SDMS.AuthenticationWebApp.dll"

